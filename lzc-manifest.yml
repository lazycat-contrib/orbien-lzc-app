application:
  subdomain: orbien
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://orbien-server:8020/
  ingress:
    - port: 9527
      protocol: tcp
    - port: 9527
      protocol: udp
  injects:
    - id: dashboard-login-autofill
      when:
        - /*
      do:
        - src: builtin://simple-inject-password
          params:
            user: "{{ .U.dashboard_user }}"
            password: "{{ .U.dashboard_password }}"

services:
  orbien-server:
    # ghcr.io/orbien-org/orbien-server:3.1.0
    image: ghcr.io/orbien-org/orbien-server:3.1.0
    restart: unless-stopped
    environment:
      ORBIEN_TOKEN: "{{ .U.orbien_token }}"
      DASHBOARD_USER: "{{ .U.dashboard_user }}"
      DASHBOARD_PASSWORD: "{{ .U.dashboard_password }}"
    setup_script: |
      install -d -m 0755 /etc/orbien
      cp /lzcapp/pkg/content/orbien-server.toml /etc/orbien/orbien-server.toml

usage: |
  Open the Orbien dashboard from the application entry. Configure the tunnel token and dashboard credentials during deployment. TCP and UDP tunnel traffic is exposed on port 9527.

