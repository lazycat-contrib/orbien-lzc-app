application:
  subdomain: orbien
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://orbien-server:8020/
  ingress:
    - port: 9527
      protocol: tcp
    - port: 9527
      protocol: udp
  injects:
    - id: dashboard-basic-auth
      on: request
      auth_required: false
      when:
        - /*
      do: |
        ctx.headers.set("Authorization", "Basic " + ctx.base64.encode("{{ .U.dashboard_user }}:{{ .U.dashboard_password }}"));
services:
  orbien-server:
    # ghcr.io/orbien-org/orbien-server:3.1.0
    # upstream: ghcr.io/orbien-org/orbien-server:3.1.0
    image: registry.lazycat.cloud/czyt/orbien-org/orbien-server:6b96d77409522b94
    restart: unless-stopped
    environment:
      ORBIEN_TOKEN: "{{ .U.orbien_token }}"
      DASHBOARD_USER: "{{ .U.dashboard_user }}"
      DASHBOARD_PASSWORD: "{{ .U.dashboard_password }}"
    setup_script: |
      install -d -m 0755 /etc/orbien
      cp /lzcapp/pkg/content/orbien-server.toml /etc/orbien/orbien-server.toml
usage: |
  从应用程序入口打开 Orbien 仪表板。在部署期间配置隧道令牌和仪表板凭证。TCP 和 UDP 隧道流量暴露在端口 9527 上。
  Open the Orbien dashboard from the application entry. Configure the tunnel token and dashboard credentials during deployment. TCP and UDP tunnel traffic is exposed on port 9527.
