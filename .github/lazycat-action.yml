version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/orbien.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: orbien-server

build:
  run_buildscript: false

images:
  - id: orbien-server
    target: service
    service: orbien-server
    source: ghcr.io/orbien-org/orbien-server
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: "Orbien 内网穿透"
    summary: "Orbien tunnel server for LazyCat"
